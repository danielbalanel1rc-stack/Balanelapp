<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RMB Turno</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0d1016;
    --surface: #13171f;
    --border: #1e2535;
    --muted: #2e3a52;
    --text: #c8cfe0;
    --dim: #5a6580;
    --red: #e74c3c;
    --yellow: #f0a500;
    --green: #27c87a;
    --blue: #4a7cf0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
    min-height: 100vh; padding-bottom: 80px;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 200;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 16px 0;
  }
  .header-top { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .header-top h1 {
    font-size: 1rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--blue); flex: 1;
  }
  #dateDisplay { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.06em; }
  .tab-bar { display: flex; }
  .tab {
    flex: 1; padding: 8px 0; text-align: center;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--dim);
    border-bottom: 2px solid transparent; cursor: pointer;
  }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* PROGRESS */
  .prog-bar { height: 2px; background: var(--border); }
  .prog-fill { height: 2px; background: var(--green); transition: width 0.3s; }

  /* PAGES */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* ── BUILD PAGE ── */
  .build-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .build-header input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 0.9rem; padding: 10px 12px;
    border-radius: 8px; outline: none;
  }
  .build-header input:focus { border-color: var(--blue); }
  .btn-icon {
    width: 40px; height: 40px; border-radius: 8px;
    border: none; cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon:active { opacity: 0.6; }
  .btn-add-sec { background: var(--blue); color: #fff; }
  .btn-clear-all { background: #2a1515; color: var(--red); font-size: 0.85rem; }

  .sec-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 12px; overflow: hidden;
  }
  .sec-card-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .sec-title-input {
    flex: 1; background: transparent; border: none;
    color: var(--text); font-size: 0.88rem; font-weight: 600; outline: none;
  }
  .sec-title-input::placeholder { color: var(--muted); }
  .btn-del-sec {
    background: none; border: none; color: var(--muted);
    font-size: 1rem; cursor: pointer; padding: 2px 4px;
  }
  .btn-del-sec:hover { color: var(--red); }
  .task-list { padding: 4px 0; }
  .task-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
  .task-input {
    flex: 1; background: transparent; border: none;
    color: var(--dim); font-size: 0.82rem; outline: none; padding: 4px 0;
  }
  .task-input:focus { color: var(--text); }
  .btn-del-task {
    background: none; border: none; color: var(--border);
    font-size: 0.9rem; cursor: pointer; padding: 0 2px; flex-shrink: 0;
  }
  .btn-del-task:hover { color: var(--red); }
  .add-task-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px; }
  .add-task-input {
    flex: 1; background: transparent; border: none;
    border-bottom: 1px solid var(--border);
    color: var(--dim); font-size: 0.82rem; outline: none; padding: 4px 0;
  }
  .add-task-input:focus { border-color: var(--blue); }
  .btn-add-task {
    background: none; border: none; color: var(--blue);
    font-size: 1.2rem; cursor: pointer; padding: 0 2px; line-height: 1;
  }
  .start-btn {
    width: 100%; padding: 14px; background: var(--blue); color: #fff;
    border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 8px;
  }
  .start-btn:active { opacity: 0.7; }

  /* ── RUN PAGE ── */
  .run-section { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

  /* Section header row */
  .run-sec-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--surface);
    cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .run-sec-header.no-border { border-bottom: none; }

  .run-sec-label {
    font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.15em; color: var(--blue); text-transform: uppercase;
  }
  .run-sec-name { flex: 1; font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .run-sec-count { font-size: 0.65rem; color: var(--dim); white-space: nowrap; }
  .run-arrow { font-size: 0.65rem; color: var(--muted); transition: transform 0.2s; }
  .run-arrow.up { transform: rotate(-90deg); }

  /* Edit toggle button */
  .btn-edit-sec {
    background: none; border: none;
    color: var(--muted); font-size: 0.78rem; cursor: pointer;
    padding: 2px 6px; border-radius: 4px;
    transition: color 0.15s, background 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn-edit-sec.active { color: var(--blue); background: #4a7cf018; }
  .btn-edit-sec:active { opacity: 0.6; }

  /* Task list in run mode */
  .run-tasks { background: var(--surface); }
  .run-tasks.hidden { display: none; }

  .run-task {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border-top: 1px solid var(--border);
    cursor: pointer; transition: filter 0.1s;
  }
  .run-task:active { filter: brightness(1.15); }
  .run-task.s-rosso  { background: #e74c3c22; }
  .run-task.s-giallo { background: #f0a50020; }
  .run-task.s-verde  { background: #27c87a1a; }

  .bollino {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
  }
  .s-rosso  .bollino { border-color: var(--red);    color: #fff; background: var(--red); }
  .s-giallo .bollino { border-color: var(--yellow); color: #0d1016; background: var(--yellow); }
  .s-verde  .bollino { border-color: var(--green);  color: #0d1016; background: var(--green); }

  .run-task-text { font-size: 0.83rem; color: var(--text); flex: 1; line-height: 1.4; }
  .s-rosso  .run-task-text { color: #f0a0a0; }
  .s-giallo .run-task-text { color: #f5d080; }
  .s-verde  .run-task-text { color: #6adfaa; text-decoration: line-through; }

  /* Inline edit panel inside run section */
  .run-edit-panel {
    background: #0f131b;
    border-top: 1px solid var(--border);
    padding: 8px 12px 10px;
  }
  .run-edit-panel.hidden { display: none; }

  .run-edit-task-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 0;
    border-bottom: 1px solid #1a2030;
  }
  .run-edit-task-row:last-of-type { border-bottom: none; }
  .run-edit-task-text { flex: 1; font-size: 0.8rem; color: var(--dim); }

  .btn-run-del-task {
    background: none; border: none; color: var(--muted);
    font-size: 0.85rem; cursor: pointer; padding: 2px 4px; flex-shrink: 0;
  }
  .btn-run-del-task:active { color: var(--red); }

  .run-add-task-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .run-add-task-input {
    flex: 1; background: transparent; border: none;
    border-bottom: 1px solid var(--muted);
    color: var(--text); font-size: 0.82rem; outline: none; padding: 4px 0;
  }
  .run-add-task-input::placeholder { color: var(--muted); }
  .run-add-task-input:focus { border-color: var(--blue); }
  .btn-run-add-task {
    background: var(--blue); color: #fff; border: none;
    border-radius: 6px; padding: 4px 10px; font-size: 0.75rem;
    cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .btn-run-add-task:active { opacity: 0.7; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.82rem; line-height: 2; }
  .empty-state .big { font-size: 2.5rem; display: block; margin-bottom: 12px; }

  /* BOTTOM */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 14px;
  }
  .legend { display: flex; gap: 12px; flex: 1; }
  .legend span { font-size: 0.62rem; color: var(--dim); display: flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .counter-label { font-size: 0.68rem; color: var(--dim); white-space: nowrap; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: #1e2535; border: 1px solid var(--border);
    color: var(--text); padding: 8px 18px; border-radius: 20px;
    font-size: 0.78rem; pointer-events: none;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>RMB Turno</h1>
    <span id="dateDisplay"></span>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tab-build" onclick="switchTab('build')">✏️ Costruisci</div>
    <div class="tab" id="tab-run" onclick="switchTab('run')">▶ Esegui</div>
  </div>
</header>
<div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

<!-- BUILD PAGE -->
<div class="page active" id="page-build">
  <div class="build-header">
    <input type="text" id="newSecInput" placeholder="Nome sezione (es. S4, Buratto...)" maxlength="40">
    <button class="btn-icon btn-add-sec" onclick="addSection()">+</button>
    <button class="btn-icon btn-clear-all" onclick="clearAll()">🗑</button>
  </div>
  <div id="sectionList"></div>
  <button class="start-btn" onclick="switchTab('run')">▶ Inizia turno</button>
</div>

<!-- RUN PAGE -->
<div class="page" id="page-run">
  <div id="runList"></div>
</div>

<div class="bottom-bar">
  <div class="legend">
    <span><span class="dot" style="background:var(--red)"></span>Da fare</span>
    <span><span class="dot" style="background:var(--yellow)"></span>In corso</span>
    <span><span class="dot" style="background:var(--green)"></span>Fatto</span>
  </div>
  <span class="counter-label" id="counterLabel">–</span>
</div>

<div class="toast" id="toast"></div>

<script>
let sections = [];
let taskState = {};
let collapseState = {};
let editingSection = null; // id of section whose edit panel is open in run view

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// Date
const now = new Date();
document.getElementById('dateDisplay').textContent =
  now.toLocaleDateString('it-IT', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }).toUpperCase();

// Tabs
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'run') renderRun();
  updateProgress();
}

// ── BUILD ──
function addSection() {
  const input = document.getElementById('newSecInput');
  const t = input.value.trim();
  if (!t) { input.focus(); return; }
  sections.push({ id: uid(), title: t, tasks: [] });
  input.value = '';
  renderBuild();
  showToast('Sezione aggiunta');
}

function deleteSection(id) {
  if (!confirm('Eliminare la sezione?')) return;
  sections = sections.filter(s => s.id !== id);
  Object.keys(taskState).forEach(k => { if (k.startsWith(id + '_')) delete taskState[k]; });
  renderBuild();
}

function addTask(secId) {
  const input = document.getElementById('addinput-' + secId);
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const sec = sections.find(s => s.id === secId);
  if (sec) { sec.tasks.push(text); input.value = ''; renderBuild(); }
}

function deleteTask(secId, idx) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  sec.tasks.splice(idx, 1);
  reindexTaskState(secId, idx);
  renderBuild();
}

function reindexTaskState(secId, removedIdx) {
  const newState = {};
  Object.keys(taskState).forEach(k => {
    if (!k.startsWith(secId + '_')) { newState[k] = taskState[k]; return; }
    const i = parseInt(k.split('_')[1]);
    if (i < removedIdx) newState[k] = taskState[k];
    else if (i > removedIdx) newState[secId + '_' + (i - 1)] = taskState[k];
  });
  // clear old keys for this section
  Object.keys(taskState).forEach(k => { if (k.startsWith(secId + '_')) delete taskState[k]; });
  Object.assign(taskState, newState);
}

function updateSectionTitle(id, val) {
  const sec = sections.find(s => s.id === id);
  if (sec) sec.title = val;
}

function updateTaskText(secId, idx, val) {
  const sec = sections.find(s => s.id === secId);
  if (sec) sec.tasks[idx] = val;
}

function clearAll() {
  if (!confirm('Svuotare tutto il turno?')) return;
  sections = []; taskState = {}; collapseState = {}; editingSection = null;
  renderBuild(); updateProgress();
  showToast('Turno svuotato');
}

function renderBuild() {
  const container = document.getElementById('sectionList');
  if (!sections.length) {
    container.innerHTML = `<div class="empty-state"><span class="big">📋</span>Nessuna sezione.<br>Aggiungi la prima sezione qui sopra.</div>`;
    return;
  }
  container.innerHTML = sections.map(sec => `
    <div class="sec-card">
      <div class="sec-card-header">
        <input class="sec-title-input" value="${esc(sec.title)}" placeholder="Nome sezione"
          oninput="updateSectionTitle('${sec.id}', this.value)">
        <button class="btn-del-sec" onclick="deleteSection('${sec.id}')">✕</button>
      </div>
      <div class="task-list">
        ${sec.tasks.map((t, i) => `
          <div class="task-row">
            <input class="task-input" value="${esc(t)}"
              oninput="updateTaskText('${sec.id}', ${i}, this.value)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('addinput-${sec.id}').focus()}">
            <button class="btn-del-task" onclick="deleteTask('${sec.id}', ${i})">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="add-task-row">
        <input class="add-task-input" id="addinput-${sec.id}" placeholder="Aggiungi compito..."
          onkeydown="if(event.key==='Enter'){event.preventDefault();addTask('${sec.id}')}">
        <button class="btn-add-task" onclick="addTask('${sec.id}')">+</button>
      </div>
    </div>
  `).join('');
}

// ── RUN ──
const STATI = ['rosso', 'giallo', 'verde'];
function taskKey(secId, idx) { return secId + '_' + idx; }

function cycleTask(secId, idx) {
  const k = taskKey(secId, idx);
  const cur = taskState[k] || 'rosso';
  taskState[k] = STATI[(STATI.indexOf(cur) + 1) % 3];
  // patch DOM
  const el = document.getElementById('rtask-' + k);
  if (el) {
    const next = taskState[k];
    el.className = 'run-task s-' + next;
    el.querySelector('.bollino').innerHTML = bollIcon(next);
  }
  updateProgress();
  updateSecCount(secId);
}

function bollIcon(s) {
  if (s === 'verde') return '✓';
  if (s === 'giallo') return '◐';
  return '';
}

function toggleRunSection(secId) {
  collapseState[secId] = !collapseState[secId];
  const body = document.getElementById('rbody-' + secId);
  const arrow = document.getElementById('rarrow-' + secId);
  if (collapseState[secId]) {
    body.classList.add('hidden');
    arrow.classList.add('up');
  } else {
    body.classList.remove('hidden');
    arrow.classList.remove('up');
  }
}

function toggleEditPanel(secId) {
  if (editingSection === secId) {
    editingSection = null;
  } else {
    editingSection = secId;
  }
  // re-render just this section's edit panel state
  renderRunSection(secId);
}

// Add task from run edit panel
function runAddTask(secId) {
  const input = document.getElementById('run-addinput-' + secId);
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  sec.tasks.push(text);
  input.value = '';
  renderRunSection(secId);
  updateProgress();
  showToast('Compito aggiunto');
}

// Delete task from run edit panel
function runDeleteTask(secId, idx) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  sec.tasks.splice(idx, 1);
  reindexTaskState(secId, idx);
  renderRunSection(secId);
  updateProgress();
  showToast('Compito rimosso');
}

function updateSecCount(secId) {
  const sec = sections.find(s => s.id === secId);
  if (!sec) return;
  const done = sec.tasks.filter((_, i) => (taskState[taskKey(secId, i)] || 'rosso') === 'verde').length;
  const el = document.getElementById('rcount-' + secId);
  if (el) el.textContent = done + '/' + sec.tasks.length;
}

// Render a single section block in Run view (for partial updates)
function renderRunSection(secId) {
  const container = document.getElementById('rsec-' + secId);
  if (!container) { renderRun(); return; }
  const sec = sections.find(s => s.id === secId);
  if (!sec) { renderRun(); return; }
  container.innerHTML = buildRunSectionHTML(sec);
}

function buildRunSectionHTML(sec) {
  const done = sec.tasks.filter((_, i) => (taskState[taskKey(sec.id, i)] || 'rosso') === 'verde').length;
  const collapsed = collapseState[sec.id] || false;
  const editing = editingSection === sec.id;

  const tasksHTML = sec.tasks.map((t, i) => {
    const stato = taskState[taskKey(sec.id, i)] || 'rosso';
    return `<div class="run-task s-${stato}" id="rtask-${taskKey(sec.id, i)}"
      onclick="cycleTask('${sec.id}', ${i})">
      <div class="bollino">${bollIcon(stato)}</div>
      <div class="run-task-text">${esc(t)}</div>
    </div>`;
  }).join('');

  const editRowsHTML = sec.tasks.map((t, i) => `
    <div class="run-edit-task-row">
      <span class="run-edit-task-text">${esc(t)}</span>
      <button class="btn-run-del-task" onclick="runDeleteTask('${sec.id}', ${i})">🗑</button>
    </div>
  `).join('');

  return `
    <div class="run-sec-header" onclick="toggleRunSection('${sec.id}')">
      <span class="run-sec-label">${esc(sec.title)}</span>
      <span class="run-sec-name"></span>
      <span class="run-sec-count" id="rcount-${sec.id}">${done}/${sec.tasks.length}</span>
      <button class="btn-edit-sec ${editing ? 'active' : ''}"
        onclick="event.stopPropagation(); toggleEditPanel('${sec.id}')">
        ${editing ? '✕ chiudi' : '✏️ modifica'}
      </button>
      <span class="run-arrow ${collapsed ? 'up' : ''}" id="rarrow-${sec.id}">▾</span>
    </div>
    <div id="rbody-${sec.id}" class="${collapsed ? 'hidden' : ''}">
      <div class="run-tasks">
        ${tasksHTML || '<div style="padding:12px 14px;font-size:0.8rem;color:var(--muted)">Nessun compito</div>'}
      </div>
      <div class="run-edit-panel ${editing ? '' : 'hidden'}">
        ${editRowsHTML}
        <div class="run-add-task-row">
          <input class="run-add-task-input" id="run-addinput-${sec.id}"
            placeholder="Nuovo compito..."
            onkeydown="if(event.key==='Enter'){event.preventDefault();runAddTask('${sec.id}')}">
          <button class="btn-run-add-task" onclick="runAddTask('${sec.id}')">+ Aggiungi</button>
        </div>
      </div>
    </div>
  `;
}

function renderRun() {
  const container = document.getElementById('runList');
  if (!sections.length) {
    container.innerHTML = `<div class="empty-state"><span class="big">🏭</span>Nessun compito.<br>Vai su "Costruisci" e aggiungi le sezioni del turno.</div>`;
    updateProgress(); return;
  }
  container.innerHTML = sections.map(sec =>
    `<div class="run-section" id="rsec-${sec.id}">${buildRunSectionHTML(sec)}</div>`
  ).join('');
  updateProgress();
}

function updateProgress() {
  let total = 0, done = 0;
  sections.forEach(sec => {
    sec.tasks.forEach((_, i) => {
      total++;
      if ((taskState[taskKey(sec.id, i)] || 'rosso') === 'verde') done++;
    });
  });
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('counterLabel').textContent = total > 0 ? `${done}/${total} ✓` : '–';
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('newSecInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addSection(); }
});

renderBuild();
updateProgress();
</script>
